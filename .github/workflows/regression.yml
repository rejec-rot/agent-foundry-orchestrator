name: regression

# The regression gate CHANGE_CONTROL.md has always required, now enforced:
# a clean checkout must be green without the author's machine, and the
# portability promises the docs make must actually hold.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Intake preflight checks the real restricted-sandbox capability. The
      # runner needs the isolation tool, but no model-provider CLI or account.
      - name: install isolation test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y bubblewrap xdg-dbus-proxy dbus-daemon dbus-tests libglib2.0-bin
          bwrap --version

      # Ubuntu's user-namespace restriction needs an explicit per-application
      # allowance. Keep the host policy enabled and grant it only to bwrap.
      - name: allow bubblewrap user namespaces
        run: |
          sudo tee /etc/apparmor.d/af-ci-bwrap >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>
          /usr/bin/bwrap flags=(default_allow) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/af-ci-bwrap
          bwrap --ro-bind / / --unshare-user -- /bin/true

      # The suite must be green on a CLEAN checkout: no sibling repositories, no
      # provider CLIs, no pre-existing runtime state.
      - name: full test suite
        run: npm test

      # A clean clone used to materialize bin/* and every .sh as non-executable,
      # which broke every launcher spawn on a fresh machine.
      - name: executable bits intact
        run: |
          mode_count=$(git ls-files -s | grep -c '^100755' || true)
          echo "100755 entries: $mode_count"
          test "$mode_count" -ge 9
          test -x bin/cline-af
          test -x bin/vertex-gemini-af
          test -x af-admin.mjs

      # README/ARCHITECTURE promise "no hardcoded host paths".
      - name: no author-machine paths
        run: |
          if grep -rn '/mnt/c/Users/\|/home/relaret' lib/ bin/ config/ af-admin.mjs; then
            echo "::error::hardcoded author-machine path found"
            exit 1
          fi

      # A missing capability registry must fail closed, not silently pass.
      - name: missing registry fails closed
        run: |
          out=$(AF_EXECUTORS_DIR=/nonexistent AF_GLOBAL_DIR=/nonexistent \
            node --input-type=module -e "import {resolveExecutorRoute} from './lib/executor-router.mjs'; console.log(JSON.stringify(resolveExecutorRoute({})));")
          echo "$out"
          echo "$out" | grep -q 'EXECUTOR_REGISTRY_MISSING'

      - name: working tree stays clean after a run
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      # Runtime state is per-machine and must not be versioned: a committed
      # circuit-breaker state can ship a banned executor as the factory default
      # and records operator reset activity. Only .gitkeep belongs here.
      - name: no runtime state is tracked
        run: |
          tracked=$(git ls-files runtime/ | grep -v -E '\.gitkeep$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::runtime state must not be tracked:"; echo "$tracked"; exit 1
          fi
