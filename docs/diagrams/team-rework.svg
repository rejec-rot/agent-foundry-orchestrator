<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title"><title id="title">暂停任务后经 Planner 改写并重新派工，保留无关成果</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#141414"/></marker></defs><rect width="100%" height="100%" fill="#f7f4ec"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif">
<text x="24" y="35" fill="#141414" font-size="22" font-weight="800">CHANGE THE DIRECTION</text>
<path d="M32 70H249V136L241 144H24V78Z" fill="#fffef9" stroke="#141414" stroke-width="2"/>
<text x="136.5" y="99" text-anchor="middle" fill="#141414" font-size="16" font-weight="700">操作员细化接口目标</text>
<text x="136.5" y="122" text-anchor="middle" fill="#141414" font-size="12" font-weight="400">绑定当前工作项版本</text>
<path d="M300 70H517V136L509 144H292V78Z" fill="#fffef9" stroke="#141414" stroke-width="2"/>
<text x="404.5" y="99" text-anchor="middle" fill="#141414" font-size="16" font-weight="700">暂停旧接口与下游任务</text>
<text x="404.5" y="122" text-anchor="middle" fill="#141414" font-size="12" font-weight="400">确认旧执行范围退出</text>
<path d="M568 70H785V136L777 144H560V78Z" fill="#141414" stroke="#141414" stroke-width="2"/>
<path d="M778 74V134" stroke="#e81932" stroke-width="5"/>
<text x="672.5" y="99" text-anchor="middle" fill="#f7f4ec" font-size="16" font-weight="700">通知 Planner 改写</text>
<text x="672.5" y="122" text-anchor="middle" fill="#f7f4ec" font-size="12" font-weight="400">保持受影响工作项挂起</text>
<path d="M836 70H1053V136L1045 144H828V78Z" fill="#141414" stroke="#141414" stroke-width="2"/>
<path d="M1046 74V134" stroke="#e81932" stroke-width="5"/>
<text x="940.5" y="99" text-anchor="middle" fill="#f7f4ec" font-size="16" font-weight="700">重新派发接口任务</text>
<text x="940.5" y="122" text-anchor="middle" fill="#f7f4ec" font-size="12" font-weight="400">使用 Planner 的新方向</text>
<path d="M251 107H290" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M519 107H558" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M787 107H826" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M836 246H1053V312L1045 320H828V254Z" fill="#fffef9" stroke="#141414" stroke-width="2"/>
<text x="940.5" y="275" text-anchor="middle" fill="#141414" font-size="16" font-weight="700">集成测试重新执行</text>
<text x="940.5" y="298" text-anchor="middle" fill="#141414" font-size="12" font-weight="400">等待新接口与页面成果</text>
<path d="M941 145V244" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M568 246H785V312L777 320H560V254Z" fill="#fffef9" stroke="#141414" stroke-width="2"/>
<text x="672.5" y="275" text-anchor="middle" fill="#141414" font-size="16" font-weight="700">独立页面框架</text>
<text x="672.5" y="298" text-anchor="middle" fill="#141414" font-size="12" font-weight="400">已接受成果继续保留</text>
<path d="M787 283H826" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M32 246H249V312L241 320H24V254Z" fill="#fffef9" stroke="#141414" stroke-width="2"/>
<text x="136.5" y="275" text-anchor="middle" fill="#141414" font-size="16" font-weight="700">旧接口尝试的迟到结果</text>
<text x="136.5" y="298" text-anchor="middle" fill="#141414" font-size="12" font-weight="400">版本校验拒绝</text>
<text x="290" y="283" fill="#b7182e" font-size="15">不能覆盖新方向</text>
</g></svg>