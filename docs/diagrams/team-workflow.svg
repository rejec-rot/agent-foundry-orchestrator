<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1238" viewBox="0 0 1000 1238" role="img" aria-labelledby="title"><title id="title">Planner 商讨、Workers 派工与 Reviewer 复检流程</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#141414"/></marker></defs><rect width="100%" height="100%" fill="#f7f4ec"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif">
<text x="280" y="35" fill="#141414" font-size="23" font-weight="800">PLAN → DISPATCH → REVIEW</text>
<path d="M288 70H960V136L952 144H280V78Z" fill="#fffef9" stroke="#141414" stroke-width="2"/>
<text x="620.0" y="99" text-anchor="middle" fill="#141414" font-size="16" font-weight="700">提交目标与选择 Planner 模型</text>
<text x="620.0" y="122" text-anchor="middle" fill="#141414" font-size="12" font-weight="400">项目与验收要求来自已登记的受信配置</text>
<path d="M620 145V171" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M288 173H960V239L952 247H280V181Z" fill="#141414" stroke="#141414" stroke-width="2"/>
<path d="M953 177V237" stroke="#e81932" stroke-width="5"/>
<text x="620.0" y="202" text-anchor="middle" fill="#f7f4ec" font-size="16" font-weight="700">与 Planner 聊天商讨</text>
<text x="620.0" y="225" text-anchor="middle" fill="#f7f4ec" font-size="12" font-weight="400">明确边界、约束与验收要求</text>
<path d="M620 248V274" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M288 276H960V342L952 350H280V284Z" fill="#141414" stroke="#141414" stroke-width="2"/>
<path d="M953 280V340" stroke="#e81932" stroke-width="5"/>
<text x="620.0" y="305" text-anchor="middle" fill="#f7f4ec" font-size="16" font-weight="700">Planner 提交行动提案</text>
<text x="620.0" y="328" text-anchor="middle" fill="#f7f4ec" font-size="12" font-weight="400">推荐 1–8 位 Worker、相同或不同模型及分工</text>
<path d="M620 351V377" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M288 379H960V445L952 453H280V387Z" fill="#fffef9" stroke="#141414" stroke-width="2"/>
<text x="620.0" y="408" text-anchor="middle" fill="#141414" font-size="16" font-weight="700">确认编组后开工</text>
<text x="620.0" y="431" text-anchor="middle" fill="#141414" font-size="12" font-weight="400">操作员确认 / 创建时选择 Planner 自动决定</text>
<path d="M620 454V480" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M288 482H960V548L952 556H280V490Z" fill="#fffef9" stroke="#141414" stroke-width="2"/>
<text x="620.0" y="511" text-anchor="middle" fill="#141414" font-size="16" font-weight="700">Workers 按依赖执行</text>
<text x="620.0" y="534" text-anchor="middle" fill="#141414" font-size="12" font-weight="400">独立任务可并行，分工与尝试分别记录</text>
<path d="M620 557V583" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M288 585H960V651L952 659H280V593Z" fill="#fffef9" stroke="#141414" stroke-width="2"/>
<text x="620.0" y="614" text-anchor="middle" fill="#141414" font-size="16" font-weight="700">接受当前版本的成果</text>
<text x="620.0" y="637" text-anchor="middle" fill="#141414" font-size="12" font-weight="400">不可变产物 · 拒绝旧尝试 · 保留无关成果</text>
<path d="M620 660V686" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M288 688H960V754L952 762H280V696Z" fill="#141414" stroke="#141414" stroke-width="2"/>
<path d="M953 692V752" stroke="#e81932" stroke-width="5"/>
<text x="620.0" y="717" text-anchor="middle" fill="#f7f4ec" font-size="16" font-weight="700">Planner 整合并密封候选</text>
<text x="620.0" y="740" text-anchor="middle" fill="#f7f4ec" font-size="12" font-weight="400">必须确认所有执行范围停止</text>
<path d="M620 763V789" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M288 791H960V857L952 865H280V799Z" fill="#141414" stroke="#141414" stroke-width="2"/>
<path d="M953 795V855" stroke="#e81932" stroke-width="5"/>
<text x="620.0" y="820" text-anchor="middle" fill="#f7f4ec" font-size="16" font-weight="700">Reviewer 使用 Planner 的模型复检</text>
<text x="620.0" y="843" text-anchor="middle" fill="#f7f4ec" font-size="12" font-weight="400">独立新会话，不复用 Planner / Worker 会话</text>
<path d="M620 866V892" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M288 894H960V960L952 968H280V902Z" fill="#fffef9" stroke="#141414" stroke-width="2"/>
<text x="620.0" y="923" text-anchor="middle" fill="#141414" font-size="16" font-weight="700">授权检查与人工批准</text>
<text x="620.0" y="946" text-anchor="middle" fill="#141414" font-size="12" font-weight="400">按现有受信交付规则处理</text>
<path d="M620 969V995" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M288 997H960V1063L952 1071H280V1005Z" fill="#fffef9" stroke="#141414" stroke-width="2"/>
<text x="620.0" y="1026" text-anchor="middle" fill="#141414" font-size="16" font-weight="700">执行受信验收命令</text>
<text x="620.0" y="1049" text-anchor="middle" fill="#141414" font-size="12" font-weight="400">绑定当前候选和验收证据，失败时停止交付</text>
<path d="M620 1072V1098" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M288 1100H960V1166L952 1174H280V1108Z" fill="#141414" stroke="#141414" stroke-width="2"/>
<path d="M953 1104V1164" stroke="#e81932" stroke-width="5"/>
<text x="620.0" y="1129" text-anchor="middle" fill="#f7f4ec" font-size="16" font-weight="700">最终校验与正式提升</text>
<text x="620.0" y="1152" text-anchor="middle" fill="#f7f4ec" font-size="12" font-weight="400">记录完成状态与交付证据</text>
<path d="M28 392H240V458L232 466H20V400Z" fill="#fffef9" stroke="#141414" stroke-width="2"/>
<text x="130.0" y="421" text-anchor="middle" fill="#141414" font-size="16" font-weight="700">操作员细化单项工作</text>
<text x="130.0" y="444" text-anchor="middle" fill="#141414" font-size="12" font-weight="400">暂停旧尝试与受影响下游</text>
<path d="M28 495H240V561L232 569H20V503Z" fill="#141414" stroke="#141414" stroke-width="2"/>
<path d="M233 499V559" stroke="#e81932" stroke-width="5"/>
<text x="130.0" y="524" text-anchor="middle" fill="#f7f4ec" font-size="16" font-weight="700">通知 Planner</text>
<text x="130.0" y="547" text-anchor="middle" fill="#f7f4ec" font-size="12" font-weight="400">保持工作项挂起</text>
<path d="M28 598H240V664L232 672H20V606Z" fill="#141414" stroke="#141414" stroke-width="2"/>
<path d="M233 602V662" stroke="#e81932" stroke-width="5"/>
<text x="130.0" y="627" text-anchor="middle" fill="#f7f4ec" font-size="16" font-weight="700">Planner 改写后重新下达</text>
<text x="130.0" y="650" text-anchor="middle" fill="#f7f4ec" font-size="12" font-weight="400">保留无关的已接受成果</text>
<path d="M130 467V493" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M130 570V596" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M240 635H260V514H278" fill="none" stroke="#141414" stroke-width="2" marker-end="url(#arrow)"/>
<text x="22" y="762" fill="#625b51" font-size="12">复检要求返工时：</text><text x="22" y="785" fill="#625b51" font-size="12">Planner 选择相关项重试，</text><text x="22" y="808" fill="#625b51" font-size="12">交付预算与版本校验继续生效。</text>
<text x="280" y="1220" fill="#625b51" font-size="11">Planner / Reviewer 同模型、独立会话；授权、验收与提升仍由 Trusted Import V2 管理。</text></g></svg>