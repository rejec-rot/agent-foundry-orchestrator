<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Foundry · V2 工作台（只读）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%2358a6ff'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="dot" aria-hidden="true"></span>
    <h1>Agent Foundry · V2 工作台</h1>
    <span class="badge readonly" title="首版只读：没有任何启动/取消/批准/提升操作">只读</span>
  </div>
  <div class="meta">
    <span id="conn" class="conn">连接中…</span>
    <span id="asof" class="asof"></span>
  </div>
</header>

<main class="layout">
  <section class="panel list" aria-label="任务列表">
    <div class="panel-head">
      <h2>任务</h2>
      <input id="filter" type="search" placeholder="按任务 ID / 状态 / 阶段过滤" aria-label="过滤任务" />
    </div>
    <div id="tasks" class="rows" role="list"></div>
  </section>

  <section class="panel detail" aria-label="任务详情">
    <div id="detail" class="detail-body">
      <p class="hint">选择左侧任一任务查看详情、阶段与证据。</p>
    </div>
  </section>

  <aside class="panel side" aria-label="新建（预检）与环境">
    <h2>新建（预检）</h2>
    <form id="submit-form" class="form" autocomplete="off">
      <label>目标 goal<input id="s-goal" type="text" placeholder="要做什么" required /></label>
      <label>目标路径 target_path<input id="s-target" type="text" placeholder="/srv/repo（必须在允许根内）" required /></label>
      <label>验收命令<input id="s-command" type="text" value="node" required /></label>
      <label>验收参数（空格分隔）<input id="s-args" type="text" value="--test tests/gate.test.mjs" /></label>
      <label>幂等键 idempotency_key<input id="s-key" type="text" placeholder="重试不会重复建任务" required /></label>
      <div class="actions">
        <button type="submit" id="s-preview">预检（只读）</button>
        <button type="button" id="s-record" disabled title="需要服务端以 --allow-write 启动">记录（不启动）</button>
      </div>
    </form>
    <pre id="submit-result" class="evidence" hidden></pre>

    <h2>环境</h2>
    <div id="environment" class="kv"></div>
    <h2>执行器</h2>
    <div id="executors" class="kv"></div>
  </aside>
</main>

<footer class="foot">
  <span>本页只读：不会启动、取消、批准或提升任何任务。</span>
  <span id="capabilities" class="caps"></span>
</footer>

<script src="/app.js"></script>
</body>
</html>
